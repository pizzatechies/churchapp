# Builds Ecclesia Connect for Android (APK + Play Store bundle) and iOS.
# Run it from the Actions tab, or push a tag like "mobile-v1.0.0".
#
# Optional repository variable:
#   ECCLESIA_CONNECT_URL        bake one church's members app into the build
# Android release signing (otherwise only a debug APK is produced):
#   ANDROID_KEYSTORE_BASE64     base64 of your .jks upload keystore
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# iOS: this job checks the app compiles. Signing and App Store upload need an Apple
# Developer account; open apps/mobile/ios/App/App.xcodeproj in Xcode (see apps/README.md).
name: Mobile app

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be read in an "if:", so expose whether the keystore is set.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run sync
        env:
          ECCLESIA_CONNECT_URL: ${{ vars.ECCLESIA_CONNECT_URL }}
      - name: Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - name: Signed release (APK + AAB)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ECCLESIA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ECCLESIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ECCLESIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export ECCLESIA_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ecclesia-connect-android
          path: |
            apps/mobile/android/app/build/outputs/apk/**/*.apk
            apps/mobile/android/app/build/outputs/bundle/**/*.aab

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run sync
        env:
          ECCLESIA_CONNECT_URL: ${{ vars.ECCLESIA_CONNECT_URL }}
      - name: Build for the iOS simulator (unsigned)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ecclesia-connect-ios-simulator
          path: apps/mobile/ios/App/build/Build/Products/Release-iphonesimulator/*.app
