# Builds Ecclesia Admin for Windows (.exe installer), macOS (.dmg) and Linux (AppImage, .deb).
# Run it from the Actions tab, or push a tag like "desktop-v1.0.0" to attach installers to a release.
#
# Optional repository variable:
#   ECCLESIA_ADMIN_URL   bake one church's server into the app (otherwise it asks on first launch)
# Optional secrets for signed builds:
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Build installers
        run: npm run dist -- --publish never
        env:
          ECCLESIA_ADMIN_URL: ${{ vars.ECCLESIA_ADMIN_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke test on Windows (install silently, start the app)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter *.exe | Where-Object Name -like '*x64*' | Select-Object -First 1
          if (-not $installer) { $installer = Get-ChildItem dist -Filter *.exe | Select-Object -First 1 }
          Write-Host "Installing $($installer.Name)"
          Start-Process $installer.FullName -ArgumentList '/S', '/currentuser' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Ecclesia Admin\Ecclesia Admin.exe'
          if (-not (Test-Path $exe)) { throw "Ecclesia Admin was not installed at $exe" }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "Ecclesia Admin quit straight away (exit code $($app.ExitCode))" }
          $title = (Get-Process -Name 'Ecclesia Admin' | Where-Object MainWindowTitle | Select-Object -First 1).MainWindowTitle
          Write-Host "Window title: '$title'"
          Stop-Process -Name 'Ecclesia Admin' -Force
          if ($title -ne 'Ecclesia Admin') { throw "Expected the Ecclesia Admin window, found '$title'" }
      - uses: actions/upload-artifact@v4
        with:
          name: ecclesia-admin-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
