# Publishes the Ecclesia website (website/) to GitHub Pages.
# Turn on once: Settings -> Pages -> Source: GitHub Actions.
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Leave the screenshot tool out of the site
        run: rm -rf website/tools
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
