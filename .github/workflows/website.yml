# Publishes the Ecclesia website (website/) to the gh-pages branch, which GitHub Pages serves.
# GitHub Pages setting: Settings -> Pages -> Deploy from a branch -> gh-pages, / (root).
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the site to the gh-pages branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf website/tools
          touch website/.nojekyll
          cd website
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish the website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
