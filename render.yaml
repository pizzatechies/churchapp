# Ecclesia on Render's free plan (see deploy/RENDER.md for the step-by-step guide).
#
# - Both apps run as free web services in Frankfurt. They sleep after 15 minutes
#   without visitors and take about a minute to wake up.
# - The database is a free Neon PostgreSQL database (neon.tech): paste its connection
#   string when Render asks for DATABASE_URL. Render's own free database is deleted
#   after 30 days, so it isn't used.
# - Free services forget files when they restart, so receipts and sermon uploads need an
#   S3-compatible bucket (Cloudflare R2, Backblaze B2...). Leave the S3 values empty to
#   start without one; administrators then see a warning.
# For always-on paid plans, use deploy/render-paid.yaml instead.
services:
  - type: web
    name: ecclesia-admin
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz/
    envVars:
      - key: APP
        value: admin
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CHURCH_COUNTRY
        value: KE
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: ecclesia-members
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz/
    envVars:
      - key: APP
        value: members
      # Shared with the admin app, so each value is entered only once.
      - key: DATABASE_URL
        fromService: { type: web, name: ecclesia-admin, envVarKey: DATABASE_URL }
      - key: SECRET_KEY
        fromService: { type: web, name: ecclesia-admin, envVarKey: SECRET_KEY }
      - key: S3_BUCKET
        fromService: { type: web, name: ecclesia-admin, envVarKey: S3_BUCKET }
      - key: S3_ENDPOINT_URL
        fromService: { type: web, name: ecclesia-admin, envVarKey: S3_ENDPOINT_URL }
      - key: S3_ACCESS_KEY_ID
        fromService: { type: web, name: ecclesia-admin, envVarKey: S3_ACCESS_KEY_ID }
      - key: S3_SECRET_ACCESS_KEY
        fromService: { type: web, name: ecclesia-admin, envVarKey: S3_SECRET_ACCESS_KEY }
      - key: DB_SSL_REQUIRE
        value: "1"
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: WEB_CONCURRENCY
        value: "2"
