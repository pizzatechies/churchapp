# Ecclesia on Render's free plan (see deploy/RENDER.md for the step-by-step guide).
#
# - Both apps run as free web services in Frankfurt. They sleep after 15 minutes
#   without visitors and take about a minute to wake up.
# - The database is Render's free PostgreSQL. Render deletes free databases 30 days
#   after they are created unless they are upgraded to a paid plan, so upgrade it (or
#   move the data) before then. deploy/RENDER.md explains how.
# - Free services forget files when they restart, so receipts and sermon uploads need an
#   S3-compatible bucket (Cloudflare R2, Backblaze B2...). Leave the S3 values empty to
#   start without one; administrators then see a warning.
# For always-on paid plans, use deploy/render-paid.yaml instead.
databases:
  - name: ecclesia-db
    plan: free
    region: frankfurt
    databaseName: ecclesia
    user: ecclesia

services:
  - type: web
    name: ecclesia-admin
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz/
    envVars:
      - key: APP
        value: admin
      - key: DATABASE_URL
        fromDatabase: { name: ecclesia-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CHURCH_COUNTRY
        value: KE
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: WEB_CONCURRENCY
        value: "2"
      # Sermon uploads over a slow connection can take several minutes.
      - key: GUNICORN_TIMEOUT
        value: "600"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: ecclesia-members
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz/
    envVars:
      - key: APP
        value: members
      - key: DATABASE_URL
        fromDatabase: { name: ecclesia-db, property: connectionString }
      - key: SECRET_KEY
        fromService: { type: web, name: ecclesia-admin, envVarKey: SECRET_KEY }
      # File storage: when you connect a bucket, add the same four S3_ values here in
      # Render (ecclesia-members > Environment) as on ecclesia-admin.
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: WEB_CONCURRENCY
        value: "2"
