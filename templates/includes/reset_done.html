{% load static %}
<div class="login-wrap">
  <div class="card login-card shadow-lg"><div class="card-body p-4 p-md-5 text-center">
    <i class="bi bi-envelope-check display-5 text-gold"></i>
    <h1 class="h4 mt-2">Check your email</h1>
    <p class="small text-body-secondary">If that address belongs to a login here, a link to choose a new password is on its way. It can take a few minutes; check your spam folder too.</p>
    <a class="btn btn-outline-primary" href="{% url login_url %}">Back to sign in</a>
  </div></div>
</div>
