# Render (render.com) on paid plans: managed PostgreSQL + both apps, always on.
# Use it from the Render dashboard: New > Blueprint, Blueprint path deploy/render-paid.yaml.
# Because the two apps run as separate services, uploads (receipts, sermons) go to an
# S3-compatible bucket: fill in the S3_* values after the first deploy.
databases:
  - name: ecclesia-db
    databaseName: ecclesia
    user: ecclesia
    plan: basic-256mb

services:
  - type: web
    name: ecclesia-admin
    runtime: docker
    plan: starter
    healthCheckPath: /healthz/
    envVars:
      - key: APP
        value: admin
      - key: DATABASE_URL
        fromDatabase: { name: ecclesia-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CHURCH_COUNTRY
        value: KE
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: ecclesia-members
    runtime: docker
    plan: starter
    healthCheckPath: /healthz/
    envVars:
      - key: APP
        value: members
      - key: DATABASE_URL
        fromDatabase: { name: ecclesia-db, property: connectionString }
      - key: SECRET_KEY
        fromService: { type: web, name: ecclesia-admin, envVarKey: SECRET_KEY }
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
